{% extends 'base.html' %}{% block content %}<section class="card narrow"><h1>Change password</h1><form method="post"><input type="hidden" name="csrf" value="{{ session.csrf }}"><label>Current password<input name="current_password" type="password" autocomplete="current-password" required></label><label>New password · at least 12 characters<input name="new_password" type="password" minlength="12" autocomplete="new-password" required></label><label>Confirm new password<input name="confirm_password" type="password" minlength="12" maxlength="256" autocomplete="new-password" required></label><button class="primary">Update password</button></form></section>{% endblock %}
